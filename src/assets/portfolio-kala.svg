  <line x1="24" y1="72" x2="616" y2="72" stroke="#2a2e3a" stroke-width="1"/>

  <circle cx="48" cy="48" r="5" fill="#f87171"/>
  <circle cx="64" cy="48" r="5" fill="#fbbf24"/>
