<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="400" fill="#111318"/>
  <defs>
    <linearGradient id="kg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8def" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b6dcf" stop-opacity="0.05"/>
