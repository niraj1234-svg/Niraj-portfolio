<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="400" fill="#0f1117"/>
  <defs>
    <pattern id="sihgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#5b8def" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#sihgrid)"/>

  <rect x="24" y="24" width="592" height="352" rx="16" fill="#141722" stroke="#252a38" stroke-width="1.5"/>

  <!-- Top bar -->
  <g transform="translate(48, 48)">
    <rect x="0" y="0" width="82" height="22" rx="11" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="41" y="15" text-anchor="middle" fill="#5b8def" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.08em">SIH 2026</text>

    <rect x="94" y="0" width="94" height="22" rx="11" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="106" cy="11" r="3" fill="#fbbf24"/>
    <text x="146" y="15" text-anchor="middle" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.08em">ONGOING</text>
  </g>

  <!-- Title -->
  <g transform="translate(48, 100)">
    <text x="0" y="28" fill="#f0f1f5" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" letter-spacing="-0.01em">Palm Oil Tariff Impact Simulator</text>
    <text x="0" y="52" fill="#8b8fa3" font-family="'Poppins', sans-serif" font-size="13">Dept. of Food &amp; Public Distribution · AI-Powered Econometric Modeling</text>
  </g>

  <!-- Simulated Graph -->
  <g transform="translate(48, 175)">
    <rect x="0" y="0" width="544" height="150" rx="10" fill="#0d0e14" stroke="#1f2330" stroke-width="1"/>

    <!-- Chart grid lines -->
    <line x1="20" y1="35" x2="524" y2="35" stroke="#252a38" stroke-dasharray="3 3"/>
    <line x1="20" y1="75" x2="524" y2="75" stroke="#252a38" stroke-dasharray="3 3"/>
    <line x1="20" y1="115" x2="524" y2="115" stroke="#252a38" stroke-dasharray="3 3"/>

    <!-- Path Curves -->
    <path d="M 40 120 C 120 100, 180 40, 260 65 C 340 90, 420 30, 500 45" fill="none" stroke="#5b8def" stroke-width="2.5"/>
    <path d="M 40 130 C 120 115, 180 85, 260 95 C 340 105, 420 70, 500 80" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Legend -->
    <circle cx="40" cy="18" r="4" fill="#5b8def"/>
    <text x="52" y="22" fill="#c8cdd8" font-family="ui-monospace, monospace" font-size="10">Domestic Price Sensitivity</text>

    <circle cx="210" cy="18" r="4" fill="#fbbf24"/>
    <text x="222" y="22" fill="#c8cdd8" font-family="ui-monospace, monospace" font-size="10">Tariff Duty Curve</text>
  </g>
</svg>
