<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="400" fill="#0e1017"/>
  <defs>
    <radialGradient id="sihbg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5b8def" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0e1017" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sihbg)"/>
  <rect x="24" y="24" width="592" height="352" rx="16" fill="#141722" stroke="#252a38" stroke-width="1.5"/>

  <!-- SIH Badge Centerpiece -->
  <g transform="translate(320, 160)" text-anchor="middle">
    <!-- Outer hexagon -->
    <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32" fill="#1c2030" stroke="#5b8def" stroke-width="2"/>
    <polygon points="0,-55 47,-27 47,27 0,55 -47,27 -47,-27" fill="#141722" stroke="#3b6dcf" stroke-width="1"/>

    <text y="-8" fill="#5b8def" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">SIH</text>
    <text y="18" fill="#f0f1f5" font-family="ui-monospace, monospace" font-size="14" font-weight="600" letter-spacing="0.1em">2025</text>
  </g>

  <g transform="translate(320, 270)" text-anchor="middle">
    <text y="0" fill="#f0f1f5" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">Smart India Hackathon 2025</text>
    <text y="24" fill="#8b8fa3" font-family="'Poppins', sans-serif" font-size="13">Ministry of Education's Innovation Cell · National Hackathon</text>

    <!-- Pill -->
    <rect x="-65" y="40" width="130" height="24" rx="12" fill="#5b8def" fill-opacity="0.15" stroke="#5b8def" stroke-opacity="0.4" stroke-width="1"/>
    <text y="56" fill="#7fa3f0" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.08em">PARTICIPATION</text>
  </g>
</svg>
